<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      #boot-shell-logo {
        height: 80px;
        width: auto;
        animation: boot-shell-thump 0.9s ease-in-out infinite;
      }

      @keyframes boot-shell-thump {
        0%,
        54%,
        100% {
          transform: scale(1) rotate(0deg);
        }
        9%,
        27%,
        45% {
          transform: scale(1.18) rotate(-6deg);
        }
        18%,
        36% {
          transform: scale(1) rotate(3deg);
        }
      }

      #boot-shell-drumbeat {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.55;
        animation: boot-shell-tung 1.2s ease-in-out infinite;
      }

      @keyframes boot-shell-tung {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.4;
        }
        16%,
        32%,
        48% {
          transform: scale(1.06);
          opacity: 0.8;
        }
        24%,
        40% {
          transform: scale(1);
          opacity: 0.5;
        }
      }
    </style>
    <title>Tung Tung Tung Sahur Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Tung Tung Tung Sahur Code splash screen">
          <svg
            id="boot-shell-logo"
            role="img"
            aria-label="Tung Tung Tung Sahur"
            viewBox="0 0 120 150"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g transform="rotate(38 92 96)">
              <rect x="86" y="26" width="12" height="76" rx="6" fill="#c89b62" />
              <rect x="83" y="18" width="18" height="26" rx="9" fill="#b9854a" />
            </g>
            <rect x="30" y="18" width="60" height="118" rx="26" fill="#8a5a2b" />
            <rect
              x="30"
              y="18"
              width="60"
              height="118"
              rx="26"
              fill="none"
              stroke="#6f4520"
              stroke-width="4"
            />
            <ellipse cx="60" cy="24" rx="26" ry="9" fill="#a9723a" />
            <ellipse cx="60" cy="24" rx="15" ry="5" fill="#c08a4b" />
            <rect x="54" y="112" width="12" height="18" rx="6" fill="#5b3a1c" />
            <ellipse cx="47" cy="62" rx="11" ry="13" fill="#ffffff" />
            <ellipse cx="73" cy="62" rx="11" ry="13" fill="#ffffff" />
            <circle cx="47" cy="64" r="5.5" fill="#1c1208" />
            <circle cx="73" cy="64" r="5.5" fill="#1c1208" />
            <circle cx="45" cy="61" r="2" fill="#ffffff" />
            <circle cx="71" cy="61" r="2" fill="#ffffff" />
            <ellipse cx="60" cy="92" rx="13" ry="10" fill="#3d2410" />
            <rect x="50" y="84" width="20" height="6" rx="3" fill="#ffffff" />
            <path
              d="M30 86 Q16 92 14 104"
              stroke="#6f4520"
              stroke-width="6"
              stroke-linecap="round"
              fill="none"
            />
            <path
              d="M90 84 Q100 86 104 78"
              stroke="#6f4520"
              stroke-width="6"
              stroke-linecap="round"
              fill="none"
            />
            <ellipse cx="46" cy="140" rx="12" ry="7" fill="#6f4520" />
            <ellipse cx="74" cy="140" rx="12" ry="7" fill="#6f4520" />
          </svg>
          <span id="boot-shell-drumbeat">tung tung tung sahur 🥁</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
